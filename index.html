<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>合成Crystal - 网页版</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#e9dfca;font-family:"Microsoft YaHei",Arial,sans-serif;color:#382d23}body{display:flex;justify-content:center;min-height:100vh}.wrap{width:min(100vw,560px);padding:10px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.title{font-weight:800;font-size:22px}.buttons button,.upload label{border:0;border-radius:10px;padding:8px 11px;background:#fff7e7;color:#493a2d;cursor:pointer;box-shadow:0 2px 7px #0001}.buttons{display:flex;gap:6px}.game{position:relative;width:100%;aspect-ratio:500/760;background:#fffdf5;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px #5b493322}.game canvas{width:100%;height:100%;display:block;touch-action:none}.help{font-size:12px;color:#756554;text-align:center;margin:7px}.panel{background:#fff7e8;border-radius:12px;padding:10px;margin-top:8px;font-size:13px}.upload{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.upload input{display:none}.files{color:#7b6854}.hint{margin-top:5px;color:#8b7761}.badge{padding:3px 7px;border-radius:99px;background:#eee1c9}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title">🍉 合成Crystal</div><div class="buttons"><button id="pauseBtn">暂停</button><button id="restartBtn">重开</button></div></div>
  <div class="game"><canvas id="game" width="500" height="760"></canvas></div>
  <div class="help">鼠标/手指移动瞄准 · 点击投放 · 空格投放 · P暂停 · R重开</div>
  <div class="panel">
    <div class="upload"><label>选择 1~11 图片<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><span class="badge" id="loaded">已加载 0/11</span></div>
    <div class="files" id="fileNames">网页会优先读取同目录的 1.png~11.png；也可以在这里选择图片。</div>
    <div class="hint">图片会自动中心裁剪成正方形并缩放。选择图片后会保存在本浏览器中。</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script>
const {Engine,World,Bodies,Body,Events,Composite}=Matter;
const W=500,H=760,FLOOR=725,DANGER=155,DROP_Y=82,MAX=11;
const R=[18,22,26,31,37,44,52,60,70,82,96];
const names=['红果','樱桃','橙子','柠檬','梨','桃子','菠萝','椰子','苹果','Crystal','西瓜'];
const colors=['#eb4852','#e03744','#f59330','#f6c53d','#5cb04e','#f1765d','#ffb037','#479f4f','#d2524b','#66b149','#4cab54'];
const dark=['#ae2937','#a32330','#c56417','#c28f1c','#31762f','#c44940','#c27119','#22672f','#9e2d2b','#347731','#236d2e'];
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let engine,world,balls=[],score=0,best=Number(localStorage.getItem('daxigua_best')||0),current=1,next=2,mouseX=250,paused=false,over=false,lastDrop=0,overSince=new Map();
let imgs={};
function weighted(){let a=[30,25,19,13,8,4,1],sum=a.reduce((x,y)=>x+y,0),r=Math.random()*sum;for(let i=0;i<a.length;i++){if((r-=a[i])<0)return i+1}return 1}
function loadStored(){try{let d=JSON.parse(localStorage.getItem('daxigua_imgs')||'{}');Object.entries(d).forEach(([k,v])=>{let im=new Image();im.onload=()=>{imgs[k]=im;refreshLoaded()};im.src=v})}catch(e){}}
function refreshLoaded(){document.getElementById('loaded').textContent=`已加载 ${Object.keys(imgs).length}/11`}
async function loadRelative(){for(let i=1;i<=11;i++){let im=new Image();im.onload=()=>{if(!imgs[i])imgs[i]=im;refreshLoaded()};im.onerror=()=>{};im.src=`${i}.png`;}}
function cropDraw(im,x,y,r){let s=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-s)/2,sy=(im.naturalHeight-s)/2;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();ctx.drawImage(im,sx,sy,s,s,x-r,y-r,2*r,2*r);ctx.restore()}
function fruit(x,y,r,l,shadow=true){if(shadow){ctx.fillStyle='#d8cdb8';ctx.beginPath();ctx.ellipse(x,y+r*.78,r*.82,r*.16,0,0,Math.PI*2);ctx.fill()}let im=imgs[l];if(im&&im.complete){ctx.fillStyle=dark[l-1];ctx.beginPath();ctx.arc(x,y,r+2,0,Math.PI*2);ctx.fill();cropDraw(im,x,y,r);ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x-r*.3,y-r*.3,Math.max(2,r*.13),0,Math.PI*2);ctx.fill();return}ctx.fillStyle=dark[l-1];ctx.beginPath();ctx.arc(x,y,r+1,0,Math.PI*2);ctx.fill();ctx.fillStyle=colors[l-1];ctx.beginPath();ctx.arc(x,y-1,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-r*.31,y-r*.32,Math.max(2,r*.16),0,Math.PI*2);ctx.fill()}
function makeBall(l,x,y){let b=Bodies.circle(x,y,R[l-1],{restitution:.16,friction:.62,density:0.0015,label:'fruit',plugin:{level:l,id:Math.random()}});b.render.visible=false;balls.push(b);World.add(world,b);return b}
function setup(){engine=Engine.create();world=engine.world;world.gravity.y=1.1;World.add(world,[Bodies.rectangle(250,FLOOR+8,500,16,{isStatic:true,restitution:.08,friction:.72}),Bodies.rectangle(-5,407,10,650,{isStatic:true}),Bodies.rectangle(505,407,10,650,{isStatic:true})]);current=weighted();next=weighted();}
function reset(){if(!engine)setup();World.clear(world,false);balls=[];World.add(world,[Bodies.rectangle(250,FLOOR+8,500,16,{isStatic:true,restitution:.08,friction:.72}),Bodies.rectangle(-5,407,10,650,{isStatic:true}),Bodies.rectangle(505,407,10,650,{isStatic:true})]);score=0;current=weighted();next=weighted();paused=false;over=false;overSince.clear()}
function drop(){if(paused||over||performance.now()-lastDrop<220)return;let r=R[current-1],x=Math.max(r+3,Math.min(W-r-3,mouseX));makeBall(current,x,DROP_Y);current=next;next=weighted();lastDrop=performance.now()}
function merge(a,b){if(!a.parent||!b.parent)return;let la=a.plugin.level,lb=b.plugin.level;if(la!==lb||la>=MAX)return;let x=(a.position.x+b.position.x)/2,y=(a.position.y+b.position.y)/2,vx=(a.velocity.x+b.velocity.x)/4,vy=(a.velocity.y+b.velocity.y)/4-.8;World.remove(world,a);World.remove(world,b);balls=balls.filter(z=>z!==a&&z!==b);let nl=la+1;score+=nl*10;makeBall(nl,Math.max(R[nl-1]+2,Math.min(W-R[nl-1]-2,x)),Math.max(DANGER-10,Math.min(FLOOR-R[nl-1]-2,y)));let n=balls[balls.length-1];Body.setVelocity(n,{x:vx,y:vy})}
function collisions(){for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j];if(!a.parent||!b.parent||a.plugin.level!==b.plugin.level||a.plugin.level>=MAX)continue;let dx=a.position.x-b.position.x,dy=a.position.y-b.position.y,dist=Math.hypot(dx,dy);if(dist<=a.circleRadius+b.circleRadius+1){merge(a,b);return true}}return false}
function gameoverCheck(){if(over)return;let now=performance.now();for(let b of balls){if(!b.parent)continue;let v=Math.hypot(b.velocity.x,b.velocity.y);let above=b.position.y-b.circleRadius*.35<DANGER,slow=v<.7;if(above&&slow){let t=overSince.get(b.id)||now;overSince.set(b.id,t);if(now-t>1050){over=true;best=Math.max(best,score);localStorage.setItem('daxigua_best',best);return}}else overSince.delete(b.id)}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f8f1dc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fffaf0';ctx.fillRect(0,0,W,95);ctx.strokeStyle='#e8dcc6';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,94);ctx.lineTo(W,94);ctx.stroke();ctx.fillStyle='#382d23';ctx.font='bold 28px Microsoft YaHei,Arial';ctx.fillText('合成Crystal',18,38);ctx.fillStyle='#7d6956';ctx.font='16px Microsoft YaHei,Arial';ctx.fillText(`分数  ${score}`,18,70);ctx.fillText(`最高  ${best}`,105,70);ctx.font='13px Microsoft YaHei,Arial';ctx.fillText('下一颗',394,22);ctx.fillStyle='#ebe3d3';ctx.beginPath();ctx.arc(455,49,30,0,Math.PI*2);ctx.fill();fruit(455,49,Math.min(24,R[next-1]*.42),next,false);ctx.fillStyle='#fffdf5';ctx.fillRect(0,95,W,FLOOR-95);ctx.strokeStyle='#e1746c';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,DANGER);ctx.lineTo(W,DANGER);ctx.stroke();ctx.fillStyle='#d74a44';ctx.font='13px Microsoft YaHei,Arial';ctx.fillText('危险线',8,DANGER-5);ctx.fillStyle='#dbc6a3';ctx.fillRect(0,FLOOR+5,W,H-FLOOR-5);ctx.strokeStyle='#af976f';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,FLOOR);ctx.lineTo(W,FLOOR);ctx.stroke();for(let b of [...balls].sort((a,b)=>b.circleRadius-a.circleRadius)){if(b.parent)fruit(b.position.x,b.position.y,b.circleRadius,b.plugin.level)}if(!over){let r=R[current-1],x=Math.max(r+4,Math.min(W-r-4,mouseX));ctx.strokeStyle='#c1ae91';ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(x,96);ctx.lineTo(x,DROP_Y-r);ctx.stroke();ctx.setLineDash([]);fruit(x,DROP_Y,r,current,false);ctx.fillStyle='#7d6956';ctx.font='13px Microsoft YaHei,Arial';ctx.textAlign='center';ctx.fillText('点击 / 空格投放',W/2,H-13);ctx.textAlign='left'}if(paused||over){ctx.fillStyle='rgba(20,15,10,.42)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff6e2';ctx.roundRect(78,260,344,235,25);ctx.fill();ctx.textAlign='center';ctx.fillStyle=over?'#d74a44':'#382d23';ctx.font='bold 34px Microsoft YaHei,Arial';ctx.fillText(over?'游戏结束':'游戏暂停',250,315);ctx.fillStyle='#382d23';ctx.font='bold 22px Microsoft YaHei,Arial';if(over){ctx.fillText(`本局得分：${score}`,250,365);ctx.font='16px Microsoft YaHei,Arial';ctx.fillText(`最高分：${best}`,250,400);ctx.fillText('按 R 或点击“重开”',250,450)}else{ctx.fillText('按 P 继续',250,380)}ctx.textAlign='left'}}
function loop(){if(!paused&&!over){Engine.update(engine,1000/60);let changed=true;while(changed){changed=collisions()}gameoverCheck()}draw();requestAnimationFrame(loop)}
function pointer(e){let r=canvas.getBoundingClientRect(),clientX=e.touches?e.touches[0].clientX:e.clientX;mouseX=(clientX-r.left)*W/r.width}
canvas.addEventListener('mousemove',pointer);canvas.addEventListener('mousedown',e=>{if(e.button===0)drop()});canvas.addEventListener('touchmove',e=>{pointer(e);e.preventDefault()},{passive:false});canvas.addEventListener('touchstart',e=>{pointer(e);drop();e.preventDefault()},{passive:false});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop()}else if(e.key.toLowerCase()==='p'&&!over)paused=!paused;else if(e.key.toLowerCase()==='r')reset()});document.getElementById('pauseBtn').onclick=()=>{if(!over)paused=!paused};document.getElementById('restartBtn').onclick=reset;
document.getElementById('imageInput').onchange=async e=>{let files=[...e.target.files];for(let f of files){let m=f.name.match(/^(\d{1,2})\.(png|jpe?g|webp)$/i);if(!m)continue;let n=+m[1];if(n<1||n>11)continue;let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{imgs[n]=im;refreshLoaded();let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(localStorage.getItem('daxigua_imgs')||'{}');d[n]=reader.result;localStorage.setItem('daxigua_imgs',JSON.stringify(d))}catch(_){} };reader.readAsDataURL(f)};im.src=url}document.getElementById('fileNames').textContent='已选择图片；刷新后仍会保留。'};
loadStored();loadRelative();setup();reset();loop();
</script></body></html>
